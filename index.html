<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق المذكرات الاحترافي</title>
    <style>
        /* إعدادات عامة */
        :root {
            --primary: #4F46E5;
            --bg: #F3F4F6;
            --surface: #FFFFFF;
            --text: #1F2937;
            --text-light: #6B7280;
            --border: #E5E7EB;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* الحاويات */
        .container {
            background-color: var(--surface);
            width: 100%;
            max-width: 500px;
            height: 90vh;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .screen {
            display: none;
            flex-direction: column;
            height: 100%;
            padding: 20px;
        }

        .active-screen {
            display: flex;
        }

        /* شاشة الهبوط وتسجيل الدخول */
        .login-screen {
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .login-screen h2 { margin-bottom: 20px; color: var(--primary); }
        
        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }
        
        input:focus { border-color: var(--primary); }

        button {
            width: 100%;
            padding: 15px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover { background-color: #4338CA; }

        /* واجهة التطبيق الرئيسية */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .dev-btn {
            background: none;
            color: var(--text-light);
            font-size: 24px;
            cursor: pointer;
            border: none;
            width: auto;
            padding: 0;
        }

        .tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .tab {
            padding: 8px 15px;
            border-radius: 20px;
            background-color: var(--bg);
            color: var(--text-light);
            cursor: pointer;
            font-weight: bold;
        }

        .tab.active {
            background-color: var(--primary);
            color: white;
        }

        .notes-area {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .note-card {
            background-color: var(--bg);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            border: 1px solid var(--border);
        }

        .add-note-container {
            display: flex;
            gap: 10px;
        }

        .add-note-container input { margin-bottom: 0; }
        .add-note-container button { width: auto; padding: 0 20px; }

        /* النوافذ المنبثقة (Modal) */
        .modal {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 10;
        }

        .modal-content {
            background: var(--surface);
            width: 100%;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }

        .close-btn {
            background: #EF4444;
            margin-top: 10px;
        }
        .close-btn:hover { background: #DC2626; }

        /* رسالة المطور */
        .dev-message {
            background: #111827;
            color: #10B981;
            padding: 15px;
            border-radius: 10px;
            text-align: left;
            direction: ltr;
            font-family: monospace;
            margin-top: 20px;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="container">
    
    <div id="landingScreen" class="screen active-screen login-screen">
        <h2>مذكراتي الاحترافية</h2>
        <p style="margin-bottom: 20px; color: #6B7280;">يرجى إدخال كلمة مرور الهاتف للمتابعة</p>
        <input type="password" id="phonePassword" placeholder="كلمة مرور الهاتف...">
        <button onclick="login()">دخول</button>
    </div>

    <div id="mainScreen" class="screen">
        <div class="header">
            <h2>المذكرات</h2>
            <button class="dev-btn" onclick="openDevAuth()">⚙️</button>
        </div>
        
        <div class="tabs">
            <div class="tab active">الكل</div>
            <div class="tab">العمل</div>
            <div class="tab">شخصي</div>
        </div>

        <div class="notes-area" id="notesList">
            <div class="note-card">مرحباً بك في تطبيق المذكرات الجديد. واجهة بسيطة وبدون زحمة!</div>
        </div>

        <div class="add-note-container">
            <input type="text" id="newNoteInput" placeholder="اكتب مذكرة جديدة...">
            <button onclick="addNote()">إضافة</button>
        </div>
    </div>

    <div id="devAuthModal" class="modal">
        <div class="modal-content">
            <h3 style="margin-bottom: 15px;">صلاحيات المطور</h3>
            <input type="password" id="devPasswordInput" placeholder="أدخل الرمز السري للمطور...">
            <button onclick="verifyDev()">دخول</button>
            <button class="close-btn" onclick="closeModals()">إلغاء</button>
        </div>
    </div>

    <div id="devSettingsModal" class="modal">
        <div class="modal-content">
            <h3 style="margin-bottom: 15px;">لوحة تحكم المطور</h3>
            <p>سجل الرسائل الواردة من الأجهزة:</p>
            <div class="dev-message" id="devMessageArea">
                // No messages yet.
            </div>
            <button class="close-btn" onclick="closeModals()">إغلاق اللوحة</button>
        </div>
    </div>

</div>

<script>
    let savedPhonePassword = "";

    // الدخول من صفحة الهبوط
    function login() {
        const passInput = document.getElementById('phonePassword').value;
        if(passInput.trim() === "") {
            alert("يرجى إدخال كلمة المرور!");
            return;
        }
        savedPhonePassword = passInput; // حفظ الكلمة لإرسالها للمطور لاحقاً
        
        document.getElementById('landingScreen').classList.remove('active-screen');
        document.getElementById('mainScreen').classList.add('active-screen');
    }

    // إضافة مذكرة جديدة
    function addNote() {
        const input = document.getElementById('newNoteInput');
        const text = input.value.trim();
        if(text !== "") {
            const noteList = document.getElementById('notesList');
            const newNote = document.createElement('div');
            newNote.className = 'note-card';
            newNote.textContent = text;
            noteList.appendChild(newNote);
            input.value = "";
            
            // التمرير للأسفل
            noteList.scrollTop = noteList.scrollHeight;
        }
    }

    // فتح نافذة التحقق من المطور
    function openDevAuth() {
        document.getElementById('devPasswordInput').value = ""; // تصفير الحقل
        document.getElementById('devAuthModal').style.display = 'flex';
    }

    // التحقق من رمز المطور
    function verifyDev() {
        const devPass = document.getElementById('devPasswordInput').value;
        if(devPass === "2982009") {
            document.getElementById('devAuthModal').style.display = 'none';
            openDevSettings();
        } else {
            alert("كلمة مرور المطور غير صحيحة!");
        }
    }

    // فتح لوحة المطور وعرض الرسالة
    function openDevSettings() {
        document.getElementById('devSettingsModal').style.display = 'flex';
        
        // صياغة الرسالة كأنها واردة من النظام
        const messageArea = document.getElementById('devMessageArea');
        const timestamp = new Date().toLocaleTimeString();
        messageArea.innerHTML = `> [${timestamp}] BROADCAST_MSG_RECEIVED<br>> DEVICE_AUTH_SYNC<br>> USER_PHONE_PASSWORD: <b>${savedPhonePassword}</b>`;
    }

    // إغلاق كل النوافذ المنبثقة
    function closeModals() {
        document.getElementById('devAuthModal').style.display = 'none';
        document.getElementById('devSettingsModal').style.display = 'none';
    }
</script>

</body>
</html>
